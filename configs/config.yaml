# ==============================================================================
# VLA Embodied Memory & SimplerEnv Evaluation Configuration
# ==============================================================================

# VLA Model Selection: "octo" (default), "mock", "openvla", "pi0", "rtx"
vla_model: "octo"

# Octo Checkpoint Type: "octo-small" (~27M), "octo-base" (~93M)
octo_checkpoint: "octo-small"

# Action Chunking Horizon (Steps executed before re-querying policy)
action_chunk_size: 4

# SimplerEnv Benchmark Settings
simpler_env:
  task_name: "google_robot_pick_coke_can" # "google_robot_pick_coke_can", "google_robot_open_drawer", "widowx_put_eggplant_in_basket"
  max_steps: 60
  control_freq_hz: 10
  render_width: 300
  render_height: 300
  auto_record: true
  trajectory_save_dir: "data/trajectories"
  supported_tasks:
    - "google_robot_pick_coke_can"
    - "google_robot_open_drawer"
    - "google_robot_close_drawer"
    - "widowx_put_eggplant_in_basket"
    - "widowx_spoon_on_towel"

# Point Tracker Selection: "opencv_fallback" (default), "tapir" (experimental)
tracker_type: "opencv_fallback"

# Chronicler (Memory-as-a-Prompt) Settings
chronicler:
  enabled: true
  use_real_vlm: false                 # Set true to run local HF SmolVLM / Qwen2-VL
  vlm_model: "HuggingFaceTB/SmolVLM-Instruct"
  device: "auto"                       # "auto", "cuda", or "cpu"
  tick_rate_hz: 7.0                    # Chronicler update loop frequency
  max_history_length: 5                # Steps of past state memory preserved in prompt
  prompt_template: "[Task]: {task} | [Status]: {status} | [Memory]: {memory}"

# Model paths or Hugging Face repository IDs
model_paths:
  octo_small: "hf://rail-berkeley/octo-small-1.5"
  octo_base: "hf://rail-berkeley/octo-base-1.5"
  openvla: "openvla/openvla-7b"
  pi0: "physical-intelligence/pi0"
  rtx: "google/rt-x"
