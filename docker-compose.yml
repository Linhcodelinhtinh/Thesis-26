version: '3.8'

services:
  robot_memory:
    build: .
    container_name: robot_memory_container
    runtime: nvidia # Enables GPU access (if using docker run natively, otherwise uses deploy block)
    ipc: host       # Vital for ROS 2 high-throughput shared memory
    network_mode: host # Allows ROS 2 node discovery on host network
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    working_dir: /workspace
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
